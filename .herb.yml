version: 0.11.2
template_engine: erubi
framework: ruby

files:
  include:
    - "**/*.herb"
    - "**/*.html.erb"
    - "**/*.html.herb"
    - "**/*.html"
    - "**/*.html+*.erb"
    - "**/*.rhtml"
    - "**/*.turbo_stream.erb"
  exclude:
    - coverage/**/*
    - log/**/*
    - node_modules/**/*
    - storage/**/*
    - tmp/**/*
    - vendor/**/*

engine:
  validators:
    security: true
    nesting: true
    accessibility: true
    generator_template: true

linter:
  enabled: true
  rules: {}

formatter:
  enabled: true
  indentWidth: 2
  indentStyle: space
  maxLineLength: 80
